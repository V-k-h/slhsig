[package]
name = "slhsig-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
rand_core = "0.10.1"
slhsig = { path = "..", features = ["all-parameter-sets"] }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sign_verify"
path = "fuzz_targets/sign_verify.rs"
test = false
doc = false
bench = false

[workspace]
